{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <div class="eyebrow mb-3">{{ t('Ваш личный кабинет') }}</div><h3 class="mb-2">{{ t('С возвращением') }}</h3><p class="text-muted mb-4">{{ t('Войдите, чтобы продолжить заботу о коже.') }}</p>
        <form method="post">
          <div class="mb-3">
            <label class="form-label" for="email">{{ t('Электронная почта') }}</label>
            <input class="form-control" id="email" name="email" type="email" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">{{ t('Пароль') }}</label>
            <input class="form-control" id="password" name="password" type="password" required>
          </div>
          <div class="d-flex justify-content-between align-items-center">
            <button class="btn btn-primary">{{ t('Войти') }}</button>
            <a href="/register">{{ t('Регистрация') }}</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
