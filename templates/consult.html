{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 d-flex flex-column">
    <span class="badge rounded-pill text-bg-light px-3 py-2 mb-3"><i class="bi bi-chat-heart me-2"></i>{{ t('Персональный помощник') }}</span>
    <h2>{{ t('Спросите о своей коже') }}</h2>
    <p class="text-muted">{{ t('Опишите вопрос — ассистент учтёт контекст вашего диалога и ответит простым языком.') }}</p>

    <div class="card border-0 mb-3">
      <div class="card-body d-flex flex-column">
        <div id="chat" class="chat-box d-flex flex-column mb-3">
          {% for m in history %}
            <div class="chat-msg {{ 'user' if m.role=='user' else 'assistant' }}">{{ m.content }}</div>
          {% endfor %}
        </div>

        <form id="chatForm" class="d-flex gap-2">
          <input id="messageInput" name="message" maxlength="4000" class="form-control" aria-label="{{ t('Сообщение ИИ-помощнику') }}" placeholder="{{ t('Что вы хотите узнать о своей коже?') }}">
          <button class="btn btn-primary" id="sendBtn" type="submit" aria-label="{{ t('Отправить сообщение') }}">
            <i class="bi bi-send-fill"></i>
          </button>
        </form>
      </div>
    </div>

  </div>
</div>

<script nonce="{{ g.csp_nonce }}">
async function sendMessage(e){
  e.preventDefault();
  const input = document.getElementById('messageInput');
  const sendBtn = document.getElementById('sendBtn');
  const txt = input.value.trim();
  if(!txt || sendBtn.disabled) return;
  const chat = document.getElementById('chat');
  const userNode = document.createElement('div');
  userNode.className = 'chat-msg user';
  userNode.textContent = txt;
  chat.appendChild(userNode);
  chat.scrollTop = chat.scrollHeight;
  input.value = '';
  input.disabled = true;
  sendBtn.disabled = true;

  const typingNode = document.createElement('div');
  typingNode.className = 'chat-msg assistant typing-indicator';
  typingNode.setAttribute('aria-label', {{ t('Консультант печатает')|tojson }});
  typingNode.innerHTML = '<span></span><span></span><span></span>';
  chat.appendChild(typingNode);
  chat.scrollTop = chat.scrollHeight;

  try {
    const form = new FormData();
    form.append('message', txt);
    const res = await fetch('/consult/send', { method: 'POST', body: form, headers: {'X-CSRF-Token': {{ csrf_token()|tojson }}} });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || {{ t('Ошибка соединения')|tojson }});

    const assistantNode = document.createElement('div');
    assistantNode.className = 'chat-msg assistant';
    assistantNode.innerHTML = formatAssistantMessage(data.answer || {{ t('Не удалось получить ответ')|tojson }});
    typingNode.replaceWith(assistantNode);
  } catch (error) {
    typingNode.textContent = error.message || {{ t('Ошибка при отправке сообщения')|tojson }};
  } finally {
    input.disabled = false;
    sendBtn.disabled = false;
    input.focus();
    chat.scrollTop = chat.scrollHeight;
  }
}

function escapeHtml(value) {
  return value.replace(/[&<>"']/g, function(character) {
    return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'}[character];
  });
}

function formatAssistantMessage(value) {
  const escaped = escapeHtml(value);
  const lines = escaped.split('\n');
  const formatted = [];
  let listOpen = false;

  lines.forEach(function(line) {
    const heading = line.match(/^#{1,3}\s+(.+)$/);
    const bullet = line.match(/^\s*[-*]\s+(.+)$/);

    if (bullet) {
      if (!listOpen) {
        formatted.push('<ul class="assistant-list">');
        listOpen = true;
      }
      formatted.push('<li>' + formatInlineMarkdown(bullet[1]) + '</li>');
      return;
    }

    if (listOpen) {
      formatted.push('</ul>');
      listOpen = false;
    }
    if (heading) {
      formatted.push('<h6 class="assistant-heading">' + formatInlineMarkdown(heading[1]) + '</h6>');
    } else if (line.trim()) {
      formatted.push('<p>' + formatInlineMarkdown(line) + '</p>');
    }
  });

  if (listOpen) formatted.push('</ul>');
  return formatted.join('');
}

function formatInlineMarkdown(value) {
  return value.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
}

document.getElementById('chatForm').addEventListener('submit', sendMessage);
const chat = document.getElementById('chat');
document.querySelectorAll('.chat-msg.assistant').forEach(function(node) {
  node.innerHTML = formatAssistantMessage(node.textContent);
});
chat.scrollTop = chat.scrollHeight;
</script>
{% endblock %}
